spring:
  application:
    name: be-interview-prep
  config:
    import:
      - optional:classpath:config/files.yml
      - optional:classpath:config/rate-limit.yml
      - optional:classpath:config/booking.yml
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:h2:mem:app;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    fail-on-missing-locations: false
